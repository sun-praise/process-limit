name: Build MSI Installer

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX v4
        run: dotnet tool install --global wix --version 4.0.6

      - name: Install WiX extensions
        run: |
          wix extension add --global WixToolset.UI.wixext/4.0.6
          wix extension add --global WixToolset.Util.wixext/4.0.6

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained
        run: dotnet publish ProcessLimit.csproj -c Release -r win-x64 --self-contained -o publish-sc -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish framework-dependent
        run: dotnet publish ProcessLimit.csproj -c Release -r win-x64 --no-self-contained -o publish-fdd -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Build MSI (self-contained)
        run: wix build Setup.wxs -o ProcessLimit-${{ steps.version.outputs.version }}-self-contained.msi -d Version=${{ steps.version.outputs.version }} -d PublishDir=publish-sc -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext

      - name: Build MSI (framework-dependent)
        run: wix build Setup.wxs -o ProcessLimit-${{ steps.version.outputs.version }}-framework-dependent.msi -d Version=${{ steps.version.outputs.version }} -d PublishDir=publish-fdd -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext

      - name: Upload MSI to release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.msi"
